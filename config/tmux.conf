# Config do tmux usada SOMENTE pelo Termos/tp (socket separado: tmux -L tp)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"
bind -n M-t  new-window -c "#{pane_current_path}"
bind -n M-w  kill-pane
bind -n M-z  resize-pane -Z
bind -n M-n  next-window
bind -n M-b  previous-window

# visual: abas discretas, sem ruído
set -g status-position top
set -g status-style "bg=#181825,fg=#6c7086"
set -g status-left ""
set -g status-right ""
set -g window-status-format "  #I  #W  "
set -g window-status-current-format "#[bg=#1e1e2e,fg=#cba6f7,bold]  #I  #W  "
set -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# painéis nomeados (nome do agente na borda) e títulos fixos
set -g allow-rename off
set -g allow-set-title off
set -g pane-border-status top
set -g pane-border-format "#{?pane_synchronized,#[fg=#f9e2af] ⇄ ,}#[fg=#cba6f7,bold] #{pane_title} "
