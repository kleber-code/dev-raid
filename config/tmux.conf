# tmux config used ONLY by /dev/raid (dedicated server, socket separate from your own tmux)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"
bind -n M-t  new-window -c "#{pane_current_path}"
bind -n M-w  confirm-before -p "close this pane? (y/n)" kill-pane
bind -n M-z  resize-pane -Z
# switch tabs (Alt+b/Alt+n would take over the shell's "previous/next word")
unbind -n M-b        # old shortcuts (previous versions) that stole keys from the shell
unbind -n M-n
# i3 style: Alt+1…9 goes to tab N; Alt+Shift+arrows moves the pane around
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-S-Left  swap-pane -U
bind -n M-S-Up    swap-pane -U
bind -n M-S-Right swap-pane -D
bind -n M-S-Down  swap-pane -D
bind -n C-PageDown next-window
bind -n C-PageUp   previous-window

# look: unobtrusive tabs, no noise
set -g status-position top
set -g status-style "bg=#181825,fg=#6c7086"
set -g status-left ""
set -g status-right ""
set -g window-status-format "  #I  #W  "
set -g window-status-current-format "#[bg=#1e1e2e,fg=#cba6f7,bold]  #I  #W  "
set -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# named panes (agent name on the border) and fixed titles
set -g allow-rename off
set -g allow-set-title off
set -g pane-border-status top
set -g pane-border-format "#{?pane_synchronized,#[fg=#f9e2af] ⇄ ,}#[fg=#cba6f7,bold] #{?#{==:#{pane_title},#{host}},Shell,#{pane_title}} "

# tmux >= 3.8 creates FLOATING panes by default (Ctrl+drag, prefix *, prefix Tab, right-click menu on empty area).
# /dev/raid uses Ctrl+click/drag for links and selection, which spawned stray floating shells.
unbind -n C-MouseDrag1Pane
unbind -n C-MouseDrag1Empty
unbind -n MouseDown1Control7
unbind -n MouseDown3Empty
unbind -n M-MouseDown3Empty
unbind *
unbind Tab
unbind BTab
unbind @
